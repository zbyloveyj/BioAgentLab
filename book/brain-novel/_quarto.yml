project:
  type: book
  output-dir: _book

lang: zh
site-url: https://zbyloveyj.github.io/BioAgentLab/brain-novel/

book:
  title: "在我们理解大脑之前"
  subtitle: "一个博士生穿越百年神经科学"
  description: "一部以真实科学史为背景的原创小说。在线开放前三章试读，完整24章尚未公开。"
  chapters:
    - index.qmd
    - ch01.qmd
    - ch02.qmd
    - ch03.qmd
    - about.qmd
  search: true
  sidebar:
    style: docked
  page-navigation: true

format:
  html:
    theme: cosmo
    css: book.css
    toc: true
    number-sections: false
    smooth-scroll: true
    code-fold: true
    mainfont: 'Noto Serif CJK SC'

execute:
  enabled: false
