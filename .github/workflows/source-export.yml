name: Export source for verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-export.yml'
      - 'book/**'
      - 'scripts/**'
      - 'bioagent/**'
permissions:
  contents: read
jobs:
  export:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[export-source]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: BioAgentLab-source
          path: |
            book/
            bioagent/
            examples/
            tests/
            scripts/
            pyproject.toml
            README.md
          if-no-files-found: error
          retention-days: 7
