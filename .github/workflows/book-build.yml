name: Build Chinese textbook
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - 'scripts/**'
      - '.github/workflows/book-build.yml'
permissions:
  contents: write
concurrency:
  group: bioagentlab-book
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-book]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install typesetting dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc texlive-xetex texlive-lang-chinese texlive-latex-extra fonts-noto-cjk fonts-dejavu-core fonts-liberation
          python -m pip install -e '.[dev,book,notebooks]'
      - name: Apply reviewed layout replacements
        shell: bash
        run: |
          git rev-parse HEAD
          python - <<'PY'
          from pathlib import Path
          import json
          entries = json.loads(Path('book/release_edits.json').read_text(encoding='utf-8'))
          for entry in entries:
              path = Path(entry['path'])
              if path.is_absolute() or '..' in path.parts or path.parts[0] not in {'book', 'scripts'}:
                  raise ValueError('Unsafe editorial path')
              text = path.read_text(encoding='utf-8')
              is_builder = path.as_posix() == 'scripts/build_book.py'
              # Normalize the known package-order correction before checking
              # original editorial anchors, making repeated builds idempotent.
              if is_builder:
                  text = text.replace('xurl,hyperref,seqsplit,bookmark', 'xurl,seqsplit,hyperref,bookmark')
              count = 0
              for edit in entry['changes']:
                  old, new = edit['old'], edit['new']
                  if new in text:
                      continue
                  if text.count(old) != 1:
                      raise ValueError(f'Editorial anchor does not match: {path}')
                  text = text.replace(old, new, 1)
                  count += 1
              if is_builder:
                  # seqsplit must see hyperref's PDF-string commands in this
                  # TeX distribution. The correction is published in the source.
                  text = text.replace('xurl,seqsplit,hyperref,bookmark', 'xurl,hyperref,seqsplit,bookmark')
              path.write_text(text, encoding='utf-8')
              print(str(path), count, 'reviewed edits')
          PY
      - name: Generate and execute notebooks
        run: python scripts/build_notebooks.py --execute
      - name: Build the complete PDF
        run: python scripts/build_book.py --min-pages 200
      - name: Verify code and release artifacts
        run: python scripts/verify_release.py
      - name: Publish book and verification records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/pdf docs/verification.json book/README.md book/zh scripts/build_book.py notebooks
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Chinese textbook, notebooks and verification [skip ci]'
            git push
          fi
      - name: Package complete learning project
        run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: BioAgentLab-Learning-Edition
          path: |
            dist/AI_Agent_for_Biology_ZH.pdf
            dist/BioAgentLab_2026_10.zip
            dist/verification.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: book-build-diagnostics
          path: |
            build/book/*.log
            build/test-results.xml
          retention-days: 7
