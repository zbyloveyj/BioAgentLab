[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioagentlab-agents-course"
version = "0.1.0"
description = "OpenAI Agents SDK 中文生物科研 Agent 实战课程"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai-agents",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "pydantic>=2.0",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4", "ipykernel>=6", "nbformat>=5"]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_course*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
