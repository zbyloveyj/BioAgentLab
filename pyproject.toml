[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioagentlab"
version = "0.1.0"
description = "Evidence-grounded AI agents for biology, bioinformatics, and biomedical discovery."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "BioAgentLab contributors"}
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6"
]

[tool.setuptools.packages.find]
include = ["bioagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
