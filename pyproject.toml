[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioagentlab"
version = "0.2.0"
description = "Evidence-grounded biology agent teaching toolkit and Chinese textbook"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "BioAgentLab contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
book = ["PyMuPDF>=1.24,<2"]
notebooks = ["nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[tool.setuptools.packages.find]
include = ["bioagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
